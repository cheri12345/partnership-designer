<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Partnership Designer — Layout K: Cover Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="v2-shared.css" />
<style>
  /* ---------- cover flow (browse): one viewport, no page scroll. A
     nostalgic nod to iPod/iTunes cover flow, opportunities as covers you
     flip through instead of scroll past. ---------- */

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body.scroll-unlocked {
    height: auto;
    min-height: 100%;
    display: block;
    overflow: visible;
  }

  .topbar {
    flex-shrink: 0;
  }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .screen[data-screen="flow"] {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .flow-topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 6px 40px 4px;
    flex-shrink: 0;
  }

  .flow-topline h1 {
    font-size: 1.25rem;
    margin: 0;
  }

  .flow-tabs {
    display: flex;
    background: #fff;
    border: 1px solid hsl(var(--border));
    border-radius: 999px;
    padding: 4px;
    flex-shrink: 0;
  }

  .flow-tab {
    border: none;
    background: none;
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 600;
    cursor: pointer;
    color: hsl(var(--stone));
    font-family: inherit;
  }

  .flow-tab.active {
    background: hsl(var(--ink));
    color: #fff;
  }

  .flow-stage-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(to bottom, transparent 58%, hsl(var(--border) / 0.55) 100%);
  }

  .flow-stage {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 1400px;
  }

  .flow-cover {
    --s: 1;
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px solid hsl(var(--ink) / 0.12);
    border-radius: 10px;
    padding: calc(18px * var(--s));
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: calc(5px * var(--s));
    text-align: left;
    box-shadow: 0 6px 16px hsl(var(--ink) / 0.1);
    transition: transform 0.4s cubic-bezier(0.22, 0.68, 0.32, 1), opacity 0.4s ease;
    font-family: inherit;
    -webkit-box-reflect: below 6px linear-gradient(to bottom, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
  }

  .flow-cover-kind {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 800;
    font-size: calc(0.75rem * var(--s));
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: hsl(var(--ink) / 0.6);
  }

  .flow-cover-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #fff;
    border: 1.5px solid hsl(var(--ink));
    border-radius: 999px;
    padding: 3px 9px;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 800;
    font-size: calc(0.75rem * var(--s));
    white-space: nowrap;
  }

  .flow-cover-name {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: calc(1.125rem * var(--s));
    line-height: 1.25;
  }

  .flow-cover-amount {
    font-size: calc(0.8125rem * var(--s));
    color: hsl(var(--ink) / 0.7);
  }

  .flow-cover-fit {
    font-size: calc(0.8125rem * var(--s));
    color: hsl(var(--ink) / 0.68);
    line-height: 1.45;
    margin-top: calc(2px * var(--s));
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .flow-cover-fit-label {
    font-size: calc(0.6875rem * var(--s));
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: hsl(var(--ink) / 0.45);
    margin-top: calc(6px * var(--s));
  }

  .flow-nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid hsl(var(--border));
    background: #fff;
    font-size: 1.125rem;
    font-family: "Archivo", system-ui, sans-serif;
    cursor: pointer;
    color: hsl(var(--ink));
    box-shadow: 0 4px 14px hsl(var(--ink) / 0.1);
  }

  .flow-nav-arrow:hover {
    border-color: hsl(var(--ink) / 0.5);
  }

  .flow-nav-arrow:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .flow-nav-prev {
    left: 24px;
  }

  .flow-nav-next {
    right: 24px;
  }

  .flow-info-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 10px 40px;
    border-top: 1px solid hsl(var(--border));
  }

  .flow-info-kind {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: hsl(var(--stone));
    margin: 0 0 2px;
  }

  .flow-info-name {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.0625rem;
    margin: 0 0 2px;
  }

  .flow-info-amount {
    font-size: 0.8125rem;
    color: hsl(var(--stone));
    margin: 0;
  }

  .flow-info-cta {
    flex-shrink: 0;
  }

  .flow-scrub-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 2px 40px 12px;
  }

  .flow-scrub-row input[type="range"] {
    flex: 1;
    accent-color: hsl(var(--ink));
  }

  .flow-count {
    font-size: 0.75rem;
    color: hsl(var(--stone));
    white-space: nowrap;
    min-width: 46px;
    text-align: right;
  }

  /* ---------- builder: section outline (left) + focused editor (right) ---------- */

  .builder-shell {
    display: grid;
    grid-template-columns: 1fr;
    padding-bottom: 84px;
  }

  @media (min-width: 860px) {
    .builder-shell {
      grid-template-columns: 300px 1fr;
    }
  }

  .builder-nav {
    padding: 28px 24px;
    border-bottom: 1px solid hsl(var(--border));
  }

  @media (min-width: 860px) {
    .builder-nav {
      border-bottom: none;
      border-right: 1px solid hsl(var(--border));
      position: sticky;
      top: 0;
      align-self: start;
      height: calc(100vh - 73px);
      overflow-y: auto;
    }
  }

  .builder-back-link {
    display: inline-block;
    margin-bottom: 20px;
  }

  .section-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .section-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid hsl(var(--border));
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: inherit;
  }

  .section-item.current {
    border-color: hsl(var(--ink));
  }

  .section-mark {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid hsl(var(--border));
    position: relative;
  }

  .section-mark.done {
    border-color: #0f766e;
    background: #0f766e;
  }

  .section-mark.done::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 2px;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }

  .section-item-label {
    font-size: 0.875rem;
    font-weight: 600;
  }

  .builder-main {
    padding: 40px 24px 60px;
    max-width: 640px;
    width: 100%;
  }

  @media (min-width: 860px) {
    .builder-main {
      padding: 48px 56px 60px;
    }
  }

  .builder-eyebrow {
    font-size: 0.8125rem;
    font-weight: 600;
    color: hsl(var(--stone));
    margin: 0 0 8px;
  }

  .builder-title {
    font-size: 1.625rem;
    margin-bottom: 12px;
  }

  .builder-helper {
    font-size: 0.875rem;
    color: hsl(var(--stone));
    line-height: 1.6;
    margin: 0 0 24px;
    max-width: 46ch;
  }

  .builder-redraft {
    margin: -14px 0 20px;
  }

  .builder-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: hsl(var(--paper) / 0.96);
    backdrop-filter: blur(6px);
    border-top: 1px solid hsl(var(--border));
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    z-index: 10;
  }

  @media (min-width: 860px) {
    .builder-footer {
      padding: 16px 56px;
    }
  }

  .builder-progress {
    font-size: 0.8125rem;
    color: hsl(var(--stone));
    margin: 0;
  }

  /* ---------- header badge + status/export + tracker (not in v2-shared.css) ---------- */

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 17px;
    height: 17px;
    padding: 0 5px;
    margin-left: 6px;
    border-radius: 999px;
    background: hsl(var(--teal));
    color: hsl(var(--ink));
    font-size: 0.6875rem;
    font-weight: 700;
  }

  .draft-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    color: hsl(var(--stone));
    margin: 0 0 20px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: hsl(38 92% 55%);
    flex-shrink: 0;
  }

  .status-dot.sent {
    background: #0f766e;
  }

  .draft-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }

  .tracker-empty {
    font-size: 0.9375rem;
    color: hsl(var(--stone));
    line-height: 1.6;
  }

  .tracker-item {
    border-top: 1px solid hsl(var(--border));
    padding: 22px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .tracker-item:last-child {
    border-bottom: 1px solid hsl(var(--border));
  }

  .tracker-kind {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: hsl(var(--stone));
    margin: 0 0 6px;
  }

  .tracker-title {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.0625rem;
    margin: 0 0 4px;
  }

  .tracker-sub {
    font-size: 0.8125rem;
    color: hsl(var(--stone));
    margin: 0;
  }

  .tracker-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .status-pill {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: hsl(38 92% 55% / 0.18);
    color: hsl(30 70% 32%);
  }

  .status-pill.sent {
    background: hsl(var(--teal) / 0.2);
    color: #0f766e;
  }

  .tracker-export {
    padding: 8px 16px;
    font-size: 0.8125rem;
  }

  .regen-link {
    display: inline-block;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    color: #0f766e;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .regen-link:hover {
    opacity: 0.75;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="index.html">CHELCIE</a>
  <button class="pill-link" id="trackerBtn">Your partnerships<span class="badge" id="trackerBadge" hidden>0</span></button>
</header>

<main>

  <section class="screen active" data-screen="flow">
    <div class="flow-topline">
      <h1>Build toward a more resilient future.</h1>
      <div class="flow-tabs" id="flowTabs">
        <button class="flow-tab active" data-tab="opportunities">Your opportunities</button>
        <button class="flow-tab" data-tab="discover">Discover new companies</button>
      </div>
    </div>

    <div class="flow-stage-wrap">
      <button class="flow-nav-arrow flow-nav-prev" id="flowPrev" aria-label="Previous">&#8592;</button>
      <div class="flow-stage" id="flowStage"></div>
      <button class="flow-nav-arrow flow-nav-next" id="flowNext" aria-label="Next">&#8594;</button>
    </div>

    <div class="flow-info-bar">
      <div>
        <p class="flow-info-kind" id="flowInfoKind"></p>
        <p class="flow-info-name" id="flowInfoName"></p>
        <p class="flow-info-amount" id="flowInfoAmount"></p>
      </div>
      <button class="btn-primary flow-info-cta" id="flowDesignBtn">Design this partnership</button>
    </div>

    <div class="flow-scrub-row">
      <input type="range" id="flowScrubber" min="0" max="12" value="0" step="1" />
      <span class="flow-count" id="flowCount">1 / 13</span>
    </div>
  </section>

  <section class="screen" data-screen="builder">
    <div class="builder-shell">
      <aside class="builder-nav">
        <button class="back-link builder-back-link" id="builderBackToFlow">← Back to the cover flow</button>
        <ul class="section-list" id="sectionList"></ul>
      </aside>
      <div class="builder-main" id="builderMain"></div>
    </div>
    <div class="builder-footer">
      <button class="back-link" id="builderBack">Back</button>
      <p class="builder-progress" id="builderProgress"></p>
      <button class="btn-primary" id="builderNext">Continue</button>
    </div>
  </section>

</main>

<div class="overlay" id="trackerOverlay">
  <header class="topbar">
    <span class="wordmark">Your partnerships</span>
    <button class="pill-link" id="trackerClose">Close</button>
  </header>
  <div class="tracker-body" id="trackerBody" style="max-width:560px; margin:0 auto; padding:48px 24px 100px; width:100%;"></div>
</div>

<script src="data.js"></script>
<script src="partnership-lib.js"></script>
<script>
  function slug(text) {
    return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  const TYPE_TINT = {
    loan: "hsl(240 5% 95%)",
    grant: "hsl(159 42% 91%)",
    corporate: "hsl(42 10% 90%)",
    equity: "hsl(43 32% 90%)",
  };

  /* ---------- cover flow: one viewport, no page scroll. Center cover
     faces forward, others recede in 3D and dim with distance, a native
     reflection underneath each (the classic iPod/iTunes look). Two tabs
     swap the whole flow between known opportunities and freshly
     discovered companies, same generative source as every other round. ---------- */

  let flowItems = [];
  let currentIndex = 0;
  let activeTab = "opportunities";

  function buildFlowItems(tab) {
    if (tab === "opportunities") {
      return OPPORTUNITIES.map((o) => ({
        tint: TYPE_TINT[o.type],
        kindLabel: TYPE_LABEL[o.type],
        badge: o.fit,
        badgeIsFit: true,
        name: o.name,
        amount: amountRange(o),
        fitBlurb: o.gain,
        designable: fromOpportunity(o),
      }));
    }
    const design = designPartnership("");
    return design.targets.map((t) => ({
      tint: TYPE_TINT.corporate,
      kindLabel: "CORPORATE",
      badge: t.check_size.split(" ")[0],
      badgeIsFit: false,
      name: t.company,
      amount: t.business_unit,
      fitBlurb: t.strategic_hook,
      designable: fromSponsor(t, design),
    }));
  }

  function renderFlow() {
    flowItems = buildFlowItems(activeTab);
    currentIndex = 0;
    const stage = document.getElementById("flowStage");
    stage.innerHTML = flowItems.map((item, i) => `
      <button class="flow-cover" data-idx="${i}" style="background:${item.tint}">
        <span class="flow-cover-badge">${item.badge}</span>
        <span class="flow-cover-kind">${item.kindLabel}</span>
        <span class="flow-cover-name">${item.name}</span>
        <span class="flow-cover-amount">${item.amount}</span>
        <span class="flow-cover-fit-label">Why this fits</span>
        <span class="flow-cover-fit">${item.fitBlurb}</span>
      </button>
    `).join("");
    stage.querySelectorAll(".flow-cover").forEach((el) => {
      el.addEventListener("click", () => {
        const i = Number(el.dataset.idx);
        if (i === currentIndex) {
          openBuilder(flowItems[i].designable);
        } else {
          goTo(i);
        }
      });
    });
    document.getElementById("flowScrubber").max = flowItems.length - 1;
    layoutCovers();
    updateInfoPanel();
  }

  function layoutCovers() {
    const covers = document.querySelectorAll(".flow-cover");
    const wrap = document.querySelector(".flow-stage-wrap");
    const wrapRect = wrap.getBoundingClientRect();

    // size covers off the space actually available, not a fixed guess:
    // this is what keeps the whole thing inside one viewport regardless
    // of window height, instead of overflowing a short window
    const coverSize = Math.max(112, Math.min(340, wrapRect.height * 0.78, wrapRect.width * 0.27));
    const SPACING = coverSize * 0.58;
    const BASE_OFFSET = coverSize * 0.58;
    const MAX_VISIBLE = 4;
    const sizeScale = (coverSize / 300).toFixed(3);

    covers.forEach((el, i) => {
      el.style.width = coverSize + "px";
      el.style.height = coverSize + "px";
      el.style.setProperty("--s", sizeScale);
      const d = i - currentIndex;
      const ad = Math.abs(d);
      if (ad > MAX_VISIBLE) {
        el.style.opacity = "0";
        el.style.pointerEvents = "none";
        return;
      }
      el.style.pointerEvents = "auto";
      const sign = Math.sign(d);
      const tx = d === 0 ? 0 : sign * (BASE_OFFSET + (ad - 1) * SPACING);
      const rot = d === 0 ? 0 : sign * -50;
      const scale = d === 0 ? 1 : Math.max(0.6, 1 - ad * 0.12);
      el.style.zIndex = 100 - ad;
      el.style.transform = `translate(-50%, -50%) translateX(${tx}px) rotateY(${rot}deg) scale(${scale})`;
      el.style.opacity = ad === MAX_VISIBLE ? "0.35" : "1";
    });
  }

  window.addEventListener("resize", layoutCovers);

  // the initial layout can run before the Archivo/Inter webfonts swap in,
  // which changes text metrics and therefore how tall the chrome around
  // the stage is; re-measure once fonts are actually ready so covers
  // aren't stuck sized for the fallback-font layout
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layoutCovers);
  }
  window.addEventListener("load", layoutCovers);

  function updateInfoPanel() {
    const item = flowItems[currentIndex];
    document.getElementById("flowInfoKind").textContent = item.kindLabel + (item.badgeIsFit ? " · Fit " + item.badge : "");
    document.getElementById("flowInfoName").textContent = item.name;
    document.getElementById("flowInfoAmount").textContent = item.amount;
    document.getElementById("flowCount").textContent = (currentIndex + 1) + " / " + flowItems.length;
    document.getElementById("flowPrev").disabled = currentIndex === 0;
    document.getElementById("flowNext").disabled = currentIndex === flowItems.length - 1;
  }

  function goTo(i) {
    currentIndex = Math.max(0, Math.min(flowItems.length - 1, i));
    layoutCovers();
    updateInfoPanel();
    document.getElementById("flowScrubber").value = currentIndex;
  }

  document.getElementById("flowPrev").addEventListener("click", () => goTo(currentIndex - 1));
  document.getElementById("flowNext").addEventListener("click", () => goTo(currentIndex + 1));
  document.getElementById("flowScrubber").addEventListener("input", (e) => goTo(Number(e.target.value)));
  document.getElementById("flowDesignBtn").addEventListener("click", () => openBuilder(flowItems[currentIndex].designable));

  window.addEventListener("keydown", (e) => {
    if (document.querySelector(".screen.active")?.dataset.screen !== "flow") return;
    if (e.key === "ArrowLeft") goTo(currentIndex - 1);
    if (e.key === "ArrowRight") goTo(currentIndex + 1);
  });

  document.getElementById("flowTabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".flow-tab");
    if (!btn) return;
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".flow-tab").forEach((b) => b.classList.toggle("active", b === btn));
    renderFlow();
  });

  renderFlow();

  /* the flow screen locks the page to exactly one viewport (no scroll);
     the builder and tracker need normal page scroll for their content,
     so unlock html/body height whenever either is showing */
  function syncScrollLock() {
    const flowActive = document.querySelector(".screen.active")?.dataset.screen === "flow"
      && !document.getElementById("trackerOverlay").classList.contains("active");
    document.body.classList.toggle("scroll-unlocked", !flowActive);
  }

  /* ---------- generalized designable ---------- */

  function fromOpportunity(o) {
    return {
      kind: "onepager",
      eyebrow: TYPE_LABEL[o.type] + " · Fit " + o.fit,
      name: o.name,
      sub: amountRange(o) + " · " + o.timeline,
      gainQuote: o.gain,
      gainSub: o.worksWith,
      termsLine: o.terms.join(", ") + ".",
      defaultAskText: defaultAsk(o),
      defaultUseText: defaultUseOfFunds(o),
      draftSubLine: () => "Partnership request to " + o.name,
      filenameBase: (org) => slug(org) + "-" + slug(o.name) + "-one-pager",
      trackerKind: "onepager",
      trackerTitle: o.name,
      trackerSubtitle: amountRange(o) + " · " + o.timeline,
    };
  }

  function fromSponsor(t, design) {
    return {
      kind: "email",
      eyebrow: "CORPORATE · " + t.business_unit,
      name: t.company,
      sub: t.check_size,
      gainQuote: t.strategic_hook,
      gainSub: t.why_them,
      termsLine: `${t.entry_vehicle} Typical structure: ${t.check_size}.`,
      defaultAskText: `A short call to explore ${t.entry_vehicle.split(".")[0].toLowerCase()}.`,
      defaultUseText: `To advance: ${design.study_summary}`,
      draftSubLine: () => `Outreach to ${t.company}, ${t.business_unit}`,
      filenameBase: (org) => slug(org) + "-" + slug(t.company) + "-outreach",
      trackerKind: "vpemail",
      trackerTitle: t.company + " outreach",
      trackerSubtitle: t.business_unit,
    };
  }

  /* ---------- builder: outline-nav + focused editor ---------- */

  const SECTIONS = [
    { id: "opportunity", label: "The opportunity", kind: "summary" },
    { id: "ask", label: "What we're asking", kind: "field", helper: "One or two sentences. CHELCIE drafted a start, edit it into your own words." },
    { id: "use", label: "How funds are used", kind: "field", helper: "Be specific, this is what gets checked against later." },
    { id: "fit", label: "Why this fits", kind: "field", helper: "Their reasoning, in your voice." },
    { id: "terms", label: "Terms under discussion", kind: "field", helper: "What's on the table so far. Nothing here is final." },
    { id: "review", label: "Review & send", kind: "review" },
  ];

  let currentDesignable = null;
  let fieldValues = {};
  let sectionIdx = 0;
  let currentTrackedEntry = null;

  const screens = Array.from(document.querySelectorAll(".screen"));
  function showScreen(id) {
    screens.forEach((s) => s.classList.toggle("active", s.dataset.screen === id));
    window.scrollTo(0, 0);
    syncScrollLock();
  }

  function openBuilder(d) {
    currentDesignable = d;
    currentTrackedEntry = null;
    fieldValues = {
      org: "Your organization",
      ask: d.defaultAskText,
      use: d.defaultUseText,
      fit: d.gainQuote,
      terms: d.termsLine,
    };
    sectionIdx = 0;
    showScreen("builder");
    renderSectionList();
    renderBuilderMain();
  }

  document.getElementById("builderBackToFlow").addEventListener("click", () => showScreen("flow"));

  function renderSectionList() {
    const list = document.getElementById("sectionList");
    list.innerHTML = SECTIONS.map((s, i) => `
      <li>
        <button class="section-item ${i === sectionIdx ? "current" : ""}" data-idx="${i}">
          <span class="section-mark ${s.kind !== "field" || fieldValues[s.id] ? "done" : ""}"></span>
          <span class="section-item-label">${s.label}</span>
        </button>
      </li>
    `).join("");
    list.querySelectorAll(".section-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        sectionIdx = Number(btn.dataset.idx);
        renderSectionList();
        renderBuilderMain();
      });
    });
  }

  function currentDocumentText() {
    const d = currentDesignable;
    const org = fieldValues.org.trim() || "Your organization";
    const text = [
      org,
      d.draftSubLine(),
      ``,
      `WHAT WE ARE ASKING`,
      fieldValues.ask,
      ``,
      `HOW THE FUNDS WILL BE USED`,
      fieldValues.use,
      ``,
      `WHY THIS FITS`,
      fieldValues.fit,
      ``,
      `TERMS UNDER DISCUSSION`,
      fieldValues.terms,
    ].join("\n");
    return { org, text };
  }

  function renderBuilderMain() {
    const d = currentDesignable;
    const s = SECTIONS[sectionIdx];
    const main = document.getElementById("builderMain");

    if (s.kind === "summary") {
      main.innerHTML = `
        <p class="builder-eyebrow">${d.eyebrow}</p>
        <h2 class="builder-title">${d.name}</h2>
        <p class="builder-helper">${d.sub}</p>
        <div class="gain-callout">
          <blockquote>${d.gainQuote}</blockquote>
          <p class="works-with">${d.gainSub}</p>
        </div>
        <div class="field-group">
          <label>Your organization</label>
          <input type="text" id="orgInput" value="${fieldValues.org}" />
        </div>
      `;
      document.getElementById("orgInput").addEventListener("input", (e) => { fieldValues.org = e.target.value; });
    } else if (s.kind === "field") {
      main.innerHTML = `
        <p class="builder-eyebrow">Section ${sectionIdx} of ${SECTIONS.length - 1}</p>
        <h2 class="builder-title">${s.label}</h2>
        <p class="builder-helper">${s.helper}</p>
        <button class="regen-link builder-redraft" id="redraftBtn">Redraft with CHELCIE</button>
        <div class="field-group">
          <textarea id="sectionField" rows="6">${fieldValues[s.id]}</textarea>
        </div>
      `;
      document.getElementById("sectionField").addEventListener("input", (e) => {
        fieldValues[s.id] = e.target.value;
        renderSectionList();
      });
      document.getElementById("redraftBtn").addEventListener("click", () => {
        const defaults = { ask: d.defaultAskText, use: d.defaultUseText, fit: d.gainQuote, terms: d.termsLine };
        fieldValues[s.id] = defaults[s.id];
        renderBuilderMain();
        renderSectionList();
      });
    } else if (s.kind === "review") {
      const { text } = currentDocumentText();
      if (!currentTrackedEntry) {
        currentTrackedEntry = addTracked({
          kind: d.trackerKind,
          title: d.trackerTitle,
          subtitle: d.trackerSubtitle,
          exportText: text,
          filename: d.filenameBase(fieldValues.org) + ".txt",
        });
      } else {
        currentTrackedEntry.exportText = text;
      }
      main.innerHTML = `
        <p class="builder-eyebrow">Last step</p>
        <h2 class="builder-title">Review &amp; send</h2>
        <p class="builder-helper">Everything below is editable from its own section on the left. Export when it's ready, or mark it sent once it's out the door.</p>
        <p class="draft-status" id="draftStatus"></p>
        <div class="draft-actions">
          <button class="btn-secondary" id="exportDraftBtn">Export .txt</button>
          <button class="btn-secondary" id="markSentBtn">Mark as sent</button>
        </div>
        <div class="draft-output"><pre style="white-space:pre-wrap; font-family:inherit; margin:0; font-size:0.875rem; line-height:1.6;">${text}</pre></div>
      `;
      renderDraftStatus();
      document.getElementById("exportDraftBtn").addEventListener("click", () => {
        currentTrackedEntry.exportText = currentDocumentText().text;
        exportEntry(currentTrackedEntry);
      });
      document.getElementById("markSentBtn").addEventListener("click", () => {
        currentTrackedEntry.status = currentTrackedEntry.status === "sent" ? "draft" : "sent";
        renderDraftStatus();
      });
    }

    document.getElementById("builderProgress").textContent = `${s.label} · ${sectionIdx + 1} of ${SECTIONS.length}`;
    document.getElementById("builderBack").style.visibility = sectionIdx === 0 ? "hidden" : "visible";
    document.getElementById("builderNext").style.visibility = sectionIdx === SECTIONS.length - 1 ? "hidden" : "visible";
  }

  document.getElementById("builderBack").addEventListener("click", () => {
    if (sectionIdx > 0) {
      sectionIdx--;
      renderSectionList();
      renderBuilderMain();
    }
  });
  document.getElementById("builderNext").addEventListener("click", () => {
    if (sectionIdx < SECTIONS.length - 1) {
      sectionIdx++;
      renderSectionList();
      renderBuilderMain();
    }
  });

  function renderDraftStatus() {
    if (!currentTrackedEntry) return;
    const st = document.getElementById("draftStatus");
    const btn = document.getElementById("markSentBtn");
    st.innerHTML = `<span class="status-dot ${currentTrackedEntry.status}"></span> ${currentTrackedEntry.status === "sent" ? "Marked as sent" : "Draft ready, not sent yet"}`;
    btn.textContent = currentTrackedEntry.status === "sent" ? "Mark as not sent" : "Mark as sent";
  }

  /* ---------- status + export tracker ---------- */

  const tracked = [];

  function addTracked(entry) {
    const record = { id: Date.now() + Math.random(), status: "draft", createdAt: new Date(), ...entry };
    tracked.unshift(record);
    updateTrackerBadge();
    return record;
  }

  function updateTrackerBadge() {
    const badge = document.getElementById("trackerBadge");
    badge.hidden = tracked.length === 0;
    badge.textContent = tracked.length;
  }

  function exportEntry(entry) {
    const blob = new Blob([entry.exportText], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = entry.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  const trackerOverlay = document.getElementById("trackerOverlay");
  document.getElementById("trackerBtn").addEventListener("click", () => {
    renderTracker();
    trackerOverlay.classList.add("active");
    syncScrollLock();
  });
  document.getElementById("trackerClose").addEventListener("click", () => {
    trackerOverlay.classList.remove("active");
    syncScrollLock();
  });

  function renderTracker() {
    const body = document.getElementById("trackerBody");
    if (tracked.length === 0) {
      body.innerHTML = `<p class="tracker-empty">Nothing drafted yet. Open any opportunity or discovered company and start designing.</p>`;
      return;
    }
    body.innerHTML = tracked.map((t, i) => `
      <div class="tracker-item">
        <div>
          <p class="tracker-kind">${t.kind === "onepager" ? "ONE-PAGER" : "OUTREACH EMAIL"}</p>
          <p class="tracker-title">${t.title}</p>
          <p class="tracker-sub">${t.subtitle}</p>
        </div>
        <div class="tracker-actions">
          <span class="status-pill ${t.status}">${t.status === "sent" ? "Sent" : "Draft ready"}</span>
          <button class="btn-secondary tracker-export" data-idx="${i}">Export</button>
          <button class="back-link tracker-toggle" data-idx="${i}">${t.status === "sent" ? "Mark as not sent" : "Mark as sent"}</button>
        </div>
      </div>
    `).join("");
    body.querySelectorAll(".tracker-export").forEach((btn) => {
      btn.addEventListener("click", () => exportEntry(tracked[Number(btn.dataset.idx)]));
    });
    body.querySelectorAll(".tracker-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const t = tracked[Number(btn.dataset.idx)];
        t.status = t.status === "sent" ? "draft" : "sent";
        renderTracker();
      });
    });
  }
</script>
</body>
</html>
