<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Partnership Designer — Layout O: Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="v2-shared.css" />
<link rel="stylesheet" href="builder-shared.css" />
<style>
  .bento-head {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 8px;
  }

  .bento-head h1 {
    font-size: 2rem;
    margin: 4px 0 10px;
  }

  .bento-sub {
    font-size: 0.9375rem;
    color: hsl(var(--stone));
    max-width: 46rem;
    line-height: 1.6;
    margin: 0;
  }

  .bento-grid {
    width: 100%;
    max-width: 1180px;
    margin: 24px auto 60px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 130px;
    gap: 14px;
    box-sizing: border-box;
  }

  @media (max-width: 760px) {
    .bento-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .bento-tile {
    border: 1px solid hsl(var(--ink) / 0.14);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .bento-tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px hsl(var(--ink) / 0.12);
  }

  .bento-tile.hero {
    grid-column: span 2;
    grid-row: span 2;
  }

  .bento-tile.wide {
    grid-column: span 2;
  }

  .bento-tile.tall {
    grid-row: span 2;
  }

  .bento-kind {
    font-size: 0.6875rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: hsl(var(--ink) / 0.5);
    margin: 0 0 4px;
  }

  .bento-name {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 700;
    font-size: 0.9375rem;
    line-height: 1.3;
    margin: 0 0 4px;
  }

  .bento-tile.hero .bento-name {
    font-size: 1.5rem;
  }

  .bento-amount {
    font-size: 0.75rem;
    color: hsl(var(--ink) / 0.6);
    margin: 0;
  }

  .bento-fit {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #fff;
    border: 1.5px solid hsl(var(--ink));
    border-radius: 999px;
    padding: 2px 9px;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 800;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="index.html">CHELCIE</a>
  <button class="pill-link" id="trackerBtn">Your partnerships<span class="badge" id="trackerBadge" hidden>0</span></button>
</header>

<main>

  <section class="screen active" data-screen="browse">
    <div class="bento-head">
      <h1>Build toward a more resilient future.</h1>
      <p class="bento-sub">Everything in one glance. Your best-fit match gets the big tile, everything else sized around it.</p>
    </div>
    <div class="bento-grid" id="bentoGrid"></div>
  </section>

  <section class="screen" data-screen="builder">
    <div class="builder-shell">
      <aside class="builder-nav">
        <button class="back-link builder-back-link" id="builderBackToBrowse">← Back to the grid</button>
        <ul class="section-list" id="sectionList"></ul>
      </aside>
      <div class="builder-main" id="builderMain"></div>
    </div>
    <div class="builder-footer">
      <button class="back-link" id="builderBack">Back</button>
      <p class="builder-progress" id="builderProgress"></p>
      <button class="btn-primary" id="builderNext">Continue</button>
    </div>
  </section>

</main>

<div class="overlay" id="trackerOverlay">
  <header class="topbar">
    <span class="wordmark">Your partnerships</span>
    <button class="pill-link" id="trackerClose">Close</button>
  </header>
  <div class="tracker-body" id="trackerBody" style="max-width:560px; margin:0 auto; padding:48px 24px 100px; width:100%;"></div>
</div>

<script src="data.js"></script>
<script src="partnership-lib.js"></script>
<script src="builder-shared.js"></script>
<script>
  /* ---------- bento grid: asymmetric tiles, best-fit match gets the
     hero slot, everything visible in one glance. ---------- */

  const TYPE_TINT = {
    loan: "hsl(240 5% 95%)",
    grant: "hsl(159 42% 91%)",
    corporate: "hsl(42 10% 90%)",
    equity: "hsl(43 32% 90%)",
  };

  const SIZE_CYCLE = ["hero", "wide", "normal", "tall", "normal", "normal", "wide", "normal", "tall", "normal", "normal", "normal", "wide", "normal", "normal", "normal"];

  function buildBentoItems() {
    const items = OPPORTUNITIES.map((o) => ({
      tint: TYPE_TINT[o.type], kind: TYPE_LABEL[o.type], fit: o.fit, name: o.name, amount: amountRange(o), designable: fromOpportunity(o),
    }));
    const design = designPartnership("");
    design.targets.forEach((t) => items.push({
      tint: TYPE_TINT.corporate, kind: "Corporate · Discovered", fit: t.check_size.split(" ")[0], name: t.company, amount: t.business_unit, designable: fromSponsor(t, design),
    }));
    items.sort((a, b) => (typeof b.fit === "number" ? b.fit : 0) - (typeof a.fit === "number" ? a.fit : 0));
    return items;
  }

  function renderBento() {
    const grid = document.getElementById("bentoGrid");
    const items = buildBentoItems();
    grid.innerHTML = items.map((item, i) => {
      const size = i === 0 ? "hero" : (SIZE_CYCLE[i] || "normal");
      const cls = size === "normal" ? "" : " " + size;
      return `
        <button class="bento-tile${cls}" style="background:${item.tint}" data-idx="${i}">
          <span class="bento-fit">${item.fit}</span>
          <p class="bento-kind">${item.kind}</p>
          <p class="bento-name">${item.name}</p>
          <p class="bento-amount">${item.amount}</p>
        </button>
      `;
    }).join("");
    grid.querySelectorAll(".bento-tile").forEach((el) => {
      el.addEventListener("click", () => openBuilder(items[Number(el.dataset.idx)].designable));
    });
  }
  renderBento();
</script>
</body>
</html>
